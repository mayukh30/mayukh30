<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Terminal card describing Mayukh Sinha's stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#0a0f1b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#141f33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <ellipse cx="360" cy="215" rx="330" ry="180" fill="url(#halo)"/>

  <!-- whole window floats -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -9; 0 0" dur="7s" repeatCount="indefinite"/>

    <!-- tilted stack: extruded back plates + main screen -->
    <g transform="translate(56,56) skewY(-5)">

      <rect x="22" y="26" width="608" height="290" rx="14" fill="url(#edge)" opacity="0.35"/>
      <rect x="12" y="14" width="608" height="290" rx="14" fill="#16223a"/>

      <g filter="url(#drop)">
        <rect x="0" y="0" width="608" height="290" rx="14" fill="url(#screen)" stroke="#2a3a5c"/>
        <path d="M0,14 a14,14 0 0 1 14,-14 h580 a14,14 0 0 1 14,14 v26 h-608 z" fill="url(#chrome)"/>
        <line x1="0" y1="40" x2="608" y2="40" stroke="#2a3a5c"/>

        <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
        <circle cx="44" cy="20" r="5.5" fill="#febc2e"/>
        <circle cx="64" cy="20" r="5.5" fill="#28c840"/>
        <text x="304" y="25" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace"
              font-size="12.5" fill="#7d93b5">mayukh@dev — ~/about</text>

        <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15">
          <text x="26" y="78" fill="#3fb950">$ <tspan fill="#c9d1d9">whoami --verbose</tspan></text>

          <text x="26" y="108" fill="#58a6ff">→ <tspan fill="#e6edf7">IT undergrad who ships across the whole stack,</tspan></text>
          <text x="26" y="130" fill="#e6edf7" xml:space="preserve">   from schema design to a model in production.</text>

          <text x="26" y="168" fill="#a78bfa">stack   <tspan fill="#7d93b5">:</tspan> <tspan fill="#c9d1d9">React · Node · FastAPI · MongoDB</tspan></text>
          <text x="26" y="194" fill="#a78bfa">ml      <tspan fill="#7d93b5">:</tspan> <tspan fill="#c9d1d9">PyTorch · YOLO · LangGraph · RAG</tspan></text>
          <text x="26" y="220" fill="#a78bfa">infra   <tspan fill="#7d93b5">:</tspan> <tspan fill="#c9d1d9">Docker · GitHub Actions · Vercel</tspan></text>
          <text x="26" y="246" fill="#a78bfa">now     <tspan fill="#7d93b5">:</tspan> <tspan fill="#c9d1d9">agentic systems · system design</tspan></text>

          <text x="26" y="274" fill="#3fb950">$ <tspan fill="#7d93b5">debug --tool console.log  </tspan><tspan fill="#f0883e"># no regrets</tspan></text>
          <rect x="330" y="262" width="9" height="16" fill="#58a6ff">
            <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>
</svg>
