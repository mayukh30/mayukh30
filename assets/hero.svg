<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mayukh Sinha — Full-stack developer, software engineer, AI/ML engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131e38"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee7ff"/>
      <stop offset="42%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="topA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ad8ff"/>
      <stop offset="100%" stop-color="#4f9dfd"/>
    </linearGradient>
    <linearGradient id="leftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4fa8"/>
      <stop offset="100%" stop-color="#122c5e"/>
    </linearGradient>
    <linearGradient id="rightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6fd6"/>
      <stop offset="100%" stop-color="#1a3f86"/>
    </linearGradient>

    <linearGradient id="topB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="leftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2a1055"/>
    </linearGradient>
    <linearGradient id="rightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b167e"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <mask id="gridMask">
      <rect x="0" y="228" width="1200" height="120" fill="url(#fade)"/>
    </mask>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="26"/>
    </clipPath>

    <filter id="titleGlow" x="-25%" y="-60%" width="150%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#58a6ff" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- isometric cube: half-width 52, top rhombus half-height 30, body depth 60 -->
    <g id="cubeA">
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z" fill="url(#topA)"/>
      <path d="M-52,0 L0,30 L0,90 L-52,60 Z" fill="url(#leftA)"/>
      <path d="M52,0 L0,30 L0,90 L52,60 Z" fill="url(#rightA)"/>
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z M-52,0 L-52,60 L0,90 L52,60 L52,0 M0,30 L0,90"
            fill="none" stroke="#bfe4ff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <g id="cubeB">
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z" fill="url(#topB)"/>
      <path d="M-52,0 L0,30 L0,90 L-52,60 Z" fill="url(#leftB)"/>
      <path d="M52,0 L0,30 L0,90 L52,60 Z" fill="url(#rightB)"/>
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z M-52,0 L-52,60 L0,90 L52,60 L52,0 M0,30 L0,90"
            fill="none" stroke="#e9d5ff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <g id="cubeWire">
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z M-52,0 L-52,60 L0,90 L52,60 L52,0 M0,30 L0,90"
            fill="none" stroke="#58a6ff" stroke-opacity="0.75" stroke-width="1.6"/>
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z" fill="#58a6ff" fill-opacity="0.08"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">

    <rect width="1200" height="340" fill="url(#bg)"/>
    <ellipse cx="215" cy="150" rx="330" ry="230" fill="url(#orbBlue)"/>
    <ellipse cx="1010" cy="185" rx="300" ry="215" fill="url(#orbViolet)"/>

    <!-- perspective floor -->
    <g mask="url(#gridMask)" stroke="#4f8bf0" stroke-width="1.1" stroke-opacity="0.75">
      <line x1="600" y1="230" x2="-1200" y2="350"/>
      <line x1="600" y1="230" x2="-960" y2="350"/>
      <line x1="600" y1="230" x2="-720" y2="350"/>
      <line x1="600" y1="230" x2="-480" y2="350"/>
      <line x1="600" y1="230" x2="-240" y2="350"/>
      <line x1="600" y1="230" x2="0" y2="350"/>
      <line x1="600" y1="230" x2="240" y2="350"/>
      <line x1="600" y1="230" x2="480" y2="350"/>
      <line x1="600" y1="230" x2="720" y2="350"/>
      <line x1="600" y1="230" x2="960" y2="350"/>
      <line x1="600" y1="230" x2="1200" y2="350"/>
      <line x1="600" y1="230" x2="1440" y2="350"/>
      <line x1="600" y1="230" x2="1680" y2="350"/>
      <line x1="600" y1="230" x2="1920" y2="350"/>
      <line x1="600" y1="230" x2="2160" y2="350"/>
      <line x1="600" y1="230" x2="2400" y2="350"/>
      <line x1="0" y1="233" x2="1200" y2="233"/>
      <line x1="0" y1="238" x2="1200" y2="238"/>
      <line x1="0" y1="245" x2="1200" y2="245"/>
      <line x1="0" y1="255" x2="1200" y2="255"/>
      <line x1="0" y1="269" x2="1200" y2="269"/>
      <line x1="0" y1="288" x2="1200" y2="288"/>
      <line x1="0" y1="313" x2="1200" y2="313"/>
      <line x1="0" y1="345" x2="1200" y2="345"/>
    </g>
    <rect x="0" y="228" width="1200" height="2" fill="#7ee7ff" opacity="0.5" filter="url(#softGlow)"/>

    <!-- drifting particles -->
    <g fill="#9fd4ff">
      <circle cx="330" cy="72" r="2">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="58" r="2.4">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="250" r="1.8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="262" r="1.8">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating cubes -->
    <g transform="translate(128,118) scale(0.62)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 0 -22; 0 0" dur="7s" repeatCount="indefinite"/>
        <use href="#cubeA"/>
      </g>
    </g>

    <g transform="translate(1062,104) scale(0.74)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 -14; 0 12; 0 -14" dur="8.5s" repeatCount="indefinite"/>
        <use href="#cubeB"/>
      </g>
    </g>

    <g transform="translate(232,232) scale(0.34)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 10; 0 -18; 0 10" dur="6s" repeatCount="indefinite"/>
        <use href="#cubeWire"/>
      </g>
    </g>

    <g transform="translate(980,244) scale(0.3)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 -12; 0 16; 0 -12" dur="9s" repeatCount="indefinite"/>
        <use href="#cubeWire"/>
      </g>
    </g>

    <!-- eyebrow pill -->
    <g transform="translate(600,58)">
      <rect x="-235" y="-16" width="470" height="32" rx="16"
            fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff" stroke-opacity="0.35"/>
      <circle cx="-213" cy="0" r="4" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="4.5" text-anchor="middle" textLength="400" lengthAdjust="spacing"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
            font-size="11.5" fill="#9fc6f5">INFORMATION TECHNOLOGY · JADAVPUR UNIVERSITY</text>
    </g>

    <!-- title -->
    <text x="600" y="162" text-anchor="middle" filter="url(#titleGlow)"
          font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
          font-size="66" font-weight="800" letter-spacing="7" fill="url(#titleGrad)">MAYUKH SINHA</text>

    <rect x="380" y="182" width="440" height="1.6" fill="url(#rule)"/>

    <text x="600" y="212" text-anchor="middle"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="14.5" letter-spacing="5.5" fill="#93adcf">FULL STACK  ·  AI / ML  ·  SYSTEM DESIGN</text>

    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="26"
          fill="none" stroke="#2a3a5c" stroke-width="1.5"/>
  </g>
</svg>
